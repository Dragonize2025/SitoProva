<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin • Mattielli Photos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .section-card { transition: all 0.2s ease; }
        .section-card:hover { transform: translateY(-3px); }
        .section-card.selected { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25); }
        .dropzone { transition: all 0.3s ease; }
        .dropzone.dragover { background-color: #312e81; border-color: #6366f1; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">

    <!-- Header -->
    <div class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-white rounded-2xl flex items-center justify-center">
                    <span class="text-zinc-950 font-bold text-xl">M</span>
                </div>
                <div>
                    <span class="font-bold text-2xl tracking-tight">Mattielli Photos</span>
                    <span class="text-xs text-zinc-500 block -mt-1">Admin Panel</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-zinc-800 px-3 py-1.5 rounded-2xl text-sm">
                    <i class="fa-solid fa-user text-emerald-400"></i>
                    <span class="font-medium">Matteo Mattielli</span>
                </div>
                <button onclick="logout()" class="px-4 py-2 text-sm hover:bg-zinc-800 rounded-2xl flex items-center gap-2 text-zinc-400 hover:text-white">
                    <i class="fa-solid fa-sign-out-alt"></i> Esci
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-8 py-10">
        
        <!-- STEP 1: Scelta Sezione -->
        <div id="sectionStep">
            <div class="mb-8">
                <h1 class="text-4xl font-bold tracking-tight">Carica nuove immagini</h1>
                <p class="text-xl text-zinc-400 mt-2">Scegli la sezione in cui inserire le foto</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="sectionsContainer"></div>
        </div>

        <!-- STEP 2: Caricamento -->
        <div id="uploadStep" class="hidden">
            <div class="flex items-center justify-between mb-8">
                <div>
                    <div class="flex items-center gap-4">
                        <h2 class="text-3xl font-bold">Carica immagini</h2>
                        <div id="sectionBadge" class="bg-indigo-600 text-white px-5 py-1.5 rounded-2xl text-sm font-medium flex items-center gap-2"></div>
                    </div>
                    <p class="text-zinc-400 mt-1">Le foto verranno salvate sul server</p>
                </div>
                <button onclick="changeSection()" class="px-6 py-3 border border-zinc-700 hover:bg-zinc-900 rounded-2xl flex items-center gap-2 text-sm">
                    <i class="fa-solid fa-arrow-left"></i> Cambia sezione
                </button>
            </div>

            <div id="dropzone" class="dropzone border-2 border-dashed border-zinc-700 hover:border-indigo-500 rounded-3xl p-20 text-center cursor-pointer bg-zinc-900">
                <div class="mx-auto w-20 h-20 bg-zinc-800 rounded-full flex items-center justify-center mb-6">
                    <i class="fa-solid fa-cloud-upload-alt text-5xl text-indigo-400"></i>
                </div>
                <h3 class="text-3xl font-semibold mb-3">Trascina qui le immagini</h3>
                <p class="text-zinc-400 mb-8">oppure</p>
                <button onclick="document.getElementById('fileInput').click()" 
                        class="bg-white text-zinc-950 hover:bg-zinc-200 transition-colors px-10 py-3.5 rounded-2xl font-semibold flex items-center gap-3 mx-auto text-lg">
                    <i class="fa-solid fa-folder-open"></i> <span>Scegli dal computer</span>
                </button>
                <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            </div>

            <div id="actions" class="hidden mt-8 flex items-center justify-between">
                <div class="flex items-center gap-4">
                    <div class="bg-zinc-900 px-6 py-2 rounded-2xl flex items-center gap-3 text-sm">
                        <i class="fa-solid fa-images text-indigo-400"></i>
                        <span id="fileCount" class="font-semibold">0 immagini</span>
                    </div>
                    <button onclick="clearAll()" class="text-red-400 hover:text-red-500 flex items-center gap-2 text-sm px-4 py-2">
                        <i class="fa-solid fa-trash"></i> Svuota tutto
                    </button>
                </div>
                <button onclick="uploadFiles()" class="bg-emerald-600 hover:bg-emerald-700 px-10 py-4 rounded-2xl font-semibold flex items-center gap-3 text-lg">
                    <i class="fa-solid fa-upload"></i> <span>Carica sul server</span>
                </button>
            </div>

            <div id="previewContainer" class="hidden mt-8">
                <h4 class="font-semibold mb-4 flex items-center gap-2 text-xl"><i class="fa-solid fa-eye"></i> Anteprima</h4>
                <div id="previewGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
            </div>
        </div>
    </div>

    <script>
        let sectionsData = {
            "Lavori": [
                { name: "Matrimoni", folder: "lavori/matrimoni" },
                { name: "Compleanni", folder: "lavori/compleanni" },
                { name: "Eventi", folder: "lavori/eventi" }
            ],
            "Mostre": [
                { name: "Assis I.A.", folder: "mostre/assis-ia" },
                { name: "Tutte giù da terra", folder: "mostre/tutte-giu-da-terra" },
                { name: "Da 100 a 0", folder: "mostre/da-100-a-0" }
            ],
            "Varie": [
                { name: "Ritratti", folder: "varie/ritratti" },
                { name: "Paesaggi", folder: "varie/paesaggi" },
                { name: "Dettagli", folder: "varie/dettagli" }
            ]
        };

        let selectedSection = null;
        let selectedFiles = [];

        function renderSections() {
            const container = document.getElementById('sectionsContainer');
            container.innerHTML = '';

            Object.keys(sectionsData).forEach(group => {
                const groupDiv = document.createElement('div');
                groupDiv.innerHTML = `
                    <div class="flex items-center justify-between mb-3 px-1">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-folder text-xl ${group === 'Lavori' ? 'text-amber-400' : group === 'Mostre' ? 'text-purple-400' : 'text-teal-400'}"></i>
                            <span class="font-semibold text-lg">${group}</span>
                        </div>
                    </div>
                    <div class="space-y-3" id="group-${group}"></div>
                `;
                container.appendChild(groupDiv);

                const groupContainer = document.getElementById(`group-${group}`);
                
                sectionsData[group].forEach(section => {
                    const card = document.createElement('div');
                    card.className = `section-card bg-zinc-900 border border-zinc-800 hover:border-indigo-500 rounded-3xl p-5 cursor-pointer flex items-center gap-4`;
                    card.innerHTML = `
                        <i class="fa-solid fa-images text-2xl text-white w-8"></i>
                        <div class="flex-1">
                            <div class="font-semibold">${section.name}</div>
                            <div class="text-xs text-zinc-500">${group}</div>
                        </div>
                    `;
                    card.onclick = () => selectSection(section, card);
                    groupContainer.appendChild(card);
                });
            });
        }

        function selectSection(section, element) {
            document.querySelectorAll('.section-card').forEach(el => el.classList.remove('selected', 'border-indigo-500'));
            element.classList.add('selected', 'border-indigo-500');
            selectedSection = section;

            const oldBtn = document.getElementById('confirmBtn');
            if (oldBtn) oldBtn.remove();

            const btn = document.createElement('button');
            btn.id = 'confirmBtn';
            btn.className = 'mt-8 w-full max-w-xs mx-auto bg-indigo-600 hover:bg-indigo-700 py-4 rounded-2xl font-semibold text-lg flex items-center justify-center gap-3';
            btn.innerHTML = `Conferma e vai al caricamento <i class="fa-solid fa-arrow-right"></i>`;
            btn.onclick = () => {
                document.getElementById('sectionStep').classList.add('hidden');
                document.getElementById('uploadStep').classList.remove('hidden');
                document.getElementById('sectionBadge').innerHTML = `<i class="fa-solid fa-folder-open mr-2"></i> ${selectedSection.name}`;
            };
            document.getElementById('sectionStep').appendChild(btn);
        }

        function changeSection() {
            document.getElementById('uploadStep').classList.add('hidden');
            document.getElementById('sectionStep').classList.remove('hidden');
            selectedFiles = [];
            document.getElementById('previewContainer').classList.add('hidden');
            document.getElementById('actions').classList.add('hidden');
            document.getElementById('previewGrid').innerHTML = '';
            const oldBtn = document.getElementById('confirmBtn');
            if (oldBtn) oldBtn.remove();
        }

        // ==================== UPLOAD REALE ====================
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const previewGrid = document.getElementById('previewGrid');
        const actions = document.getElementById('actions');
        const fileCount = document.getElementById('fileCount');

        dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => { handleFiles(fileInput.files); fileInput.value = ''; });

        function handleFiles(files) {
            const valid = [];
            Array.from(files).forEach(f => {
                if (!f.type.startsWith('image/')) { alert(`"${f.name}" non è un'immagine`); return; }
                if (f.size > 10*1024*1024) { alert(`"${f.name}" troppo grande`); return; }
                valid.push(f);
            });
            if (valid.length) {
                selectedFiles = [...selectedFiles, ...valid].slice(0, 30);
                renderPreviews();
            }
        }

        function renderPreviews() {
            previewGrid.innerHTML = '';
            if (!selectedFiles.length) {
                previewContainer.classList.add('hidden'); actions.classList.add('hidden'); return;
            }
            previewContainer.classList.remove('hidden');
            actions.classList.remove('hidden');
            fileCount.textContent = `${selectedFiles.length} immagini`;

            selectedFiles.forEach((file, i) => {
                const card = document.createElement('div');
                card.className = 'bg-zinc-900 border border-zinc-800 rounded-2xl overflow-hidden';
                const reader = new FileReader();
                reader.onload = e => {
                    card.innerHTML = `
                        <div class="relative">
                            <img src="${e.target.result}" class="w-full h-40 object-cover">
                            <button onclick="removeFile(${i}, event)" class="absolute top-2 right-2 w-7 h-7 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center">
                                <i class="fa-solid fa-times text-xs"></i>
                            </button>
                            <div class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/80 p-3 text-xs">
                                <div class="truncate">${file.name}</div>
                                <div class="text-white/60">${(file.size/1024/1024).toFixed(1)} MB</div>
                            </div>
                        </div>`;
                };
                reader.readAsDataURL(file);
                previewGrid.appendChild(card);
            });
        }

        function removeFile(i, e) { e.stopImmediatePropagation(); selectedFiles.splice(i,1); renderPreviews(); }
        function clearAll() { if(confirm('Rimuovere tutte le immagini?')) { selectedFiles=[]; renderPreviews(); } }

        function uploadFiles() {
            if (!selectedSection || !selectedFiles.length) return;

            const formData = new FormData();
            formData.append('section', selectedSection.folder);

            selectedFiles.forEach(file => {
                formData.append('images[]', file);
            });

            const xhr = new XMLHttpRequest();
            xhr.open('POST', 'upload.php', true);

            xhr.upload.onprogress = function(e) {
                if (e.lengthComputable) {
                    const percent = Math.round((e.loaded / e.total) * 100);
                    // Qui puoi aggiornare una barra di progresso reale se vuoi
                }
            };

            xhr.onload = function() {
                if (xhr.status === 200) {
                    const response = JSON.parse(xhr.responseText);
                    if (response.success) {
                        alert("✅ " + response.message);
                        selectedFiles = [];
                        renderPreviews();
                        document.getElementById('uploadStep').classList.add('hidden');
                        document.getElementById('sectionStep').classList.remove('hidden');
                    } else {
                        alert("Errore: " + response.message);
                    }
                } else {
                    alert("Errore durante il caricamento");
                }
            };

            xhr.send(formData);
        }

        function logout() {
            if (confirm('Vuoi uscire?')) alert('Logout');
        }

        function init() {
            renderSections();
        }
        window.onload = init;
    </script>
</body>
</html>

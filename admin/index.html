<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin • Mattielli Photos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .dropzone { transition: all 0.3s ease; }
        .dropzone.dragover { background-color: #312e81; border-color: #6366f1; }
        .preview-card { transition: all 0.2s ease; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">

    <!-- Header -->
    <div class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-white rounded-2xl flex items-center justify-center">
                    <span class="text-zinc-950 font-bold text-xl">M</span>
                </div>
                <div>
                    <span class="font-bold text-2xl tracking-tight">Mattielli Photos</span>
                    <span class="text-xs text-zinc-500 block -mt-1">Admin Panel</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-zinc-800 px-3 py-1.5 rounded-2xl text-sm">
                    <i class="fa-solid fa-user text-emerald-400"></i>
                    <span class="font-medium">Matteo Mattielli</span>
                </div>
                <button onclick="logout()" class="px-4 py-2 text-sm hover:bg-zinc-800 rounded-2xl flex items-center gap-2 text-zinc-400 hover:text-white">
                    <i class="fa-solid fa-sign-out-alt"></i> Esci
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-8 py-10">
        <div class="mb-8">
            <h1 class="text-4xl font-bold tracking-tight">Carica immagini su Cloudinary</h1>
            <p class="text-xl text-zinc-400 mt-2">Seleziona le immagini, rivedile e poi caricale</p>
        </div>

        <!-- Selezione Sezione -->
        <div class="mb-6">
            <label class="block text-sm font-medium mb-2">Sezione di destinazione</label>
            <select id="sectionSelect" class="bg-zinc-900 border border-zinc-700 text-white px-4 py-3 rounded-2xl w-full max-w-md">
                <option value="lavori/matrimoni">Lavori - Matrimoni</option>
                <option value="lavori/compleanni">Lavori - Compleanni</option>
                <option value="lavori/eventi">Lavori - Eventi</option>
                <option value="mostre/assis-ia">Mostre - Assis I.A.</option>
                <option value="mostre/tutte-giu-da-terra">Mostre - Tutte giù da terra</option>
                <option value="mostre/da-100-a-0">Mostre - Da 100 a 0</option>
                <option value="varie/ritratti">Varie - Ritratti</option>
                <option value="varie/paesaggi">Varie - Paesaggi</option>
                <option value="varie/dettagli">Varie - Dettagli</option>
            </select>
        </div>

        <!-- Dropzone -->
        <div id="dropzone" class="dropzone border-2 border-dashed border-zinc-700 hover:border-indigo-500 rounded-3xl p-16 text-center cursor-pointer bg-zinc-900 mb-6">
            <div class="mx-auto w-16 h-16 bg-zinc-800 rounded-full flex items-center justify-center mb-4">
                <i class="fa-solid fa-cloud-upload-alt text-4xl text-indigo-400"></i>
            </div>
            <h3 class="text-2xl font-semibold mb-2">Trascina qui le immagini</h3>
            <p class="text-zinc-400 mb-4">oppure</p>
            <button onclick="document.getElementById('fileInput').click()" 
                    class="bg-white text-zinc-950 hover:bg-zinc-200 px-8 py-3 rounded-2xl font-semibold flex items-center gap-3 mx-auto">
                <i class="fa-solid fa-folder-open"></i>
                <span>Scegli dal computer</span>
            </button>
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <p class="text-xs text-zinc-500 mt-4">JPG, PNG, WEBP • Max 10MB</p>
        </div>

        <!-- Anteprima immagini selezionate -->
        <div id="previewSection" class="hidden mb-8">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-semibold text-lg">Immagini selezionate</h3>
                <button onclick="clearSelection()" class="text-sm text-red-400 hover:text-red-500 flex items-center gap-2">
                    <i class="fa-solid fa-trash"></i> Svuota selezione
                </button>
            </div>
            <div id="previewGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4 mb-6"></div>

            <!-- Pulsante Carica -->
            <button onclick="uploadAllToCloudinary()" 
                    class="w-full bg-emerald-600 hover:bg-emerald-700 py-4 rounded-2xl font-semibold text-lg flex items-center justify-center gap-3">
                <i class="fa-solid fa-upload"></i>
                <span>Carica su Cloudinary</span>
            </button>
        </div>

        <!-- Immagini caricate con successo -->
        <div id="uploadedSection" class="hidden">
            <h3 class="font-semibold mb-4 text-lg">Immagini caricate con successo</h3>
            <div id="uploadedGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
        </div>
    </div>

    <script>
        // ==================== CONFIGURAZIONE CLOUDINARY ====================
        const CLOUD_NAME = "dImg7wnh1";           // ← Il tuo Cloud Name
        const UPLOAD_PRESET = "mattielli_upload"; // ← Il nome del tuo Upload Preset

        let selectedFiles = [];

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const previewSection = document.getElementById('previewSection');
        const previewGrid = document.getElementById('previewGrid');
        const uploadedSection = document.getElementById('uploadedSection');
        const uploadedGrid = document.getElementById('uploadedGrid');

        // Drag & Drop
        dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', e => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => handleFiles(fileInput.files));

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (file.type.startsWith('image/')) {
                    selectedFiles.push(file);
                } else {
                    alert(`${file.name} non è un'immagine valida`);
                }
            });
            renderPreviews();
        }

        function renderPreviews() {
            previewGrid.innerHTML = '';
            if (selectedFiles.length === 0) {
                previewSection.classList.add('hidden');
                return;
            }
            previewSection.classList.remove('hidden');

            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const card = document.createElement('div');
                    card.className = 'preview-card bg-zinc-900 border border-zinc-700 rounded-2xl overflow-hidden';
                    card.innerHTML = `
                        <div class="relative">
                            <img src="${e.target.result}" class="w-full h-40 object-cover">
                            <button onclick="removeFile(${index}, event)" 
                                    class="absolute top-2 right-2 w-7 h-7 bg-red-600 hover:bg-red-700 rounded-full flex items-center justify-center">
                                <i class="fa-solid fa-times text-xs"></i>
                            </button>
                        </div>
                        <div class="p-3 text-sm">
                            <div class="truncate">${file.name}</div>
                            <div class="text-xs text-zinc-400">${(file.size / 1024 / 1024).toFixed(1)} MB</div>
                        </div>
                    `;
                    previewGrid.appendChild(card);
                };
                reader.readAsDataURL(file);
            });
        }

        function removeFile(index, e) {
            e.stopImmediatePropagation();
            selectedFiles.splice(index, 1);
            renderPreviews();
        }

        function clearSelection() {
            selectedFiles = [];
            renderPreviews();
        }

        // ==================== UPLOAD SU CLOUDINARY ====================
        async function uploadAllToCloudinary() {
            if (selectedFiles.length === 0) return;

            const section = document.getElementById('sectionSelect').value;
            const button = event.currentTarget;
            
            uploadedGrid.innerHTML = '';
            uploadedSection.classList.remove('hidden');

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                await uploadSingleFile(file, section);
            }

            alert(`${selectedFiles.length} immagini caricate con successo su Cloudinary!`);
            selectedFiles = [];
            renderPreviews();
        }

        async function uploadSingleFile(file, section) {
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('folder', `mattielliphotos/${section}`);

            const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();

                if (data.secure_url) {
                    showUploadedSuccess(data.secure_url, file.name, section);
                } else {
                    console.error('Errore upload:', data);
                }
            } catch (error) {
                console.error('Errore di rete:', error);
            }
        }

        function showUploadedSuccess(url, filename, section) {
            const card = document.createElement('div');
            card.className = 'bg-zinc-900 border border-zinc-700 rounded-2xl overflow-hidden';
            card.innerHTML = `
                <img src="${url}" class="w-full h-40 object-cover">
                <div class="p-3 text-sm">
                    <div class="truncate font-medium">${filename}</div>
                    <div class="text-xs text-zinc-400 mb-2">${section}</div>
                    <button onclick="copyToClipboard('${url}', this)" 
                            class="text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1 rounded-xl">
                        Copia URL
                    </button>
                </div>
            `;
            uploadedGrid.appendChild(card);
        }

        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                const original = button.innerHTML;
                button.innerHTML = 'Copiato!';
                setTimeout(() => button.innerHTML = original, 1500);
            });
        }

        function logout() {
            if (confirm('Vuoi uscire dall\'area admin?')) {
                window.location.href = '../index.html';
            }
        }
    </script>
</body>
</html>

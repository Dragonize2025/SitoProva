<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin • Mattielli Photos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        .section-card { transition: all 0.2s ease; }
        .section-card:hover { transform: translateY(-3px); }
        .section-card.selected { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25); }
        .dropzone { transition: all 0.3s ease; }
        .dropzone.dragover { background-color: #312e81; border-color: #6366f1; }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200">

    <!-- Header -->
    <div class="bg-zinc-900 border-b border-zinc-800 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-white rounded-2xl flex items-center justify-center">
                    <span class="text-zinc-950 font-bold text-xl">M</span>
                </div>
                <div>
                    <span class="font-bold text-2xl tracking-tight">Mattielli Photos</span>
                    <span class="text-xs text-zinc-500 block -mt-1">Admin Panel</span>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 bg-zinc-800 px-3 py-1.5 rounded-2xl text-sm">
                    <i class="fa-solid fa-user text-emerald-400"></i>
                    <span class="font-medium">Matteo Mattielli</span>
                </div>
                <button onclick="logout()" class="px-4 py-2 text-sm hover:bg-zinc-800 rounded-2xl flex items-center gap-2 text-zinc-400 hover:text-white">
                    <i class="fa-solid fa-sign-out-alt"></i> Esci
                </button>
            </div>
        </div>
    </div>

    <div class="max-w-6xl mx-auto px-8 py-10">
        <div class="mb-8">
            <h1 class="text-4xl font-bold tracking-tight">Carica immagini su Cloudinary</h1>
            <p class="text-xl text-zinc-400 mt-2">Le immagini verranno salvate su Cloudinary e ottimizzate automaticamente</p>
        </div>

        <!-- Selezione Sezione -->
        <div class="mb-6">
            <label class="block text-sm font-medium mb-2">Sezione di destinazione</label>
            <select id="sectionSelect" class="bg-zinc-900 border border-zinc-700 text-white px-4 py-3 rounded-2xl w-full max-w-md">
                <option value="lavori/matrimoni">Lavori - Matrimoni</option>
                <option value="lavori/compleanni">Lavori - Compleanni</option>
                <option value="lavori/eventi">Lavori - Eventi</option>
                <option value="mostre/assis-ia">Mostre - Assis I.A.</option>
                <option value="mostre/tutte-giu-da-terra">Mostre - Tutte giù da terra</option>
                <option value="mostre/da-100-a-0">Mostre - Da 100 a 0</option>
                <option value="varie/ritratti">Varie - Ritratti</option>
                <option value="varie/paesaggi">Varie - Paesaggi</option>
                <option value="varie/dettagli">Varie - Dettagli</option>
            </select>
        </div>

        <!-- Dropzone -->
        <div id="dropzone" class="dropzone border-2 border-dashed border-zinc-700 hover:border-indigo-500 rounded-3xl p-16 text-center cursor-pointer bg-zinc-900 mb-8">
            <div class="mx-auto w-16 h-16 bg-zinc-800 rounded-full flex items-center justify-center mb-4">
                <i class="fa-solid fa-cloud-upload-alt text-4xl text-indigo-400"></i>
            </div>
            <h3 class="text-2xl font-semibold mb-2">Trascina qui le immagini</h3>
            <p class="text-zinc-400 mb-4">oppure</p>
            <button onclick="document.getElementById('fileInput').click()" 
                    class="bg-white text-zinc-950 hover:bg-zinc-200 px-8 py-3 rounded-2xl font-semibold flex items-center gap-3 mx-auto">
                <i class="fa-solid fa-folder-open"></i>
                <span>Scegli dal computer</span>
            </button>
            <input type="file" id="fileInput" multiple accept="image/*" class="hidden">
            <p class="text-xs text-zinc-500 mt-4">JPG, PNG, WEBP • Max 10MB</p>
        </div>

        <!-- Lista immagini caricate -->
        <div id="uploadedList" class="hidden">
            <h3 class="font-semibold mb-4 text-lg">Immagini caricate in questa sessione</h3>
            <div id="uploadedGrid" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
        </div>
    </div>

    <script>
        const CLOUD_NAME = "dimg7wnh1";     // ← Sostituisci con il tuo
        const UPLOAD_PRESET = "mattielliphotos_upload";             // ← Nome del tuo Upload Preset

        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('fileInput');
        const uploadedGrid = document.getElementById('uploadedGrid');
        const uploadedList = document.getElementById('uploadedList');

        dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
        dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
        dropzone.addEventListener('drop', e => {
            e.preventDefault();
            dropzone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        dropzone.addEventListener('click', () => fileInput.click());
        fileInput.addEventListener('change', () => handleFiles(fileInput.files));

        function handleFiles(files) {
            Array.from(files).forEach(file => {
                if (!file.type.startsWith('image/')) {
                    alert(`${file.name} non è un'immagine`);
                    return;
                }
                uploadToCloudinary(file);
            });
        }

        function uploadToCloudinary(file) {
            const section = document.getElementById('sectionSelect').value;
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', UPLOAD_PRESET);
            formData.append('folder', `mattielliphotos/${section}`);

            const url = `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`;

            fetch(url, {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                if (data.secure_url) {
                    showUploadedImage(data.secure_url, file.name, section);
                } else {
                    alert("Errore durante il caricamento");
                }
            })
            .catch(() => alert("Errore di connessione con Cloudinary"));
        }

        function showUploadedImage(url, filename, section) {
            uploadedList.classList.remove('hidden');

            const div = document.createElement('div');
            div.className = 'bg-zinc-900 border border-zinc-700 rounded-2xl overflow-hidden';
            div.innerHTML = `
                <img src="${url}" class="w-full h-40 object-cover">
                <div class="p-3 text-sm">
                    <div class="font-medium truncate">${filename}</div>
                    <div class="text-xs text-zinc-400">${section}</div>
                    <button onclick="copyToClipboard('${url}', this)" 
                            class="mt-2 text-xs bg-zinc-800 hover:bg-zinc-700 px-3 py-1 rounded-xl">
                        Copia URL
                    </button>
                </div>
            `;
            uploadedGrid.appendChild(div);
        }

        function copyToClipboard(text, button) {
            navigator.clipboard.writeText(text).then(() => {
                const originalText = button.innerHTML;
                button.innerHTML = 'Copiato!';
                setTimeout(() => button.innerHTML = originalText, 1500);
            });
        }

        function logout() {
            if (confirm('Vuoi uscire?')) {
                window.location.href = '../index.html';
            }
        }

        // Istruzioni iniziali
        console.log('%c[Admin] Pannello Cloudinary pronto. Inserisci il tuo Cloud Name.', 'color:#6366f1');
    </script>
</body>
</html>
